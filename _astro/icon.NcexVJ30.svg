<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Natamux</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22355E"/>
      <stop offset="1" stop-color="#0B1222"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <!-- The shadow is its own shape: a filter over the tile would band its dark gradient. -->
  <rect x="100" y="114" width="824" height="824" rx="186" fill="#000000" fill-opacity="0.35" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#body)"/>
  <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <g fill="none" stroke-linecap="round" stroke-width="72">
    <path d="M297 712 L 297 312" stroke="#F2B544"/>
    <path d="M297 312 L 629 712" stroke="#7FA8FF"/>
    <path d="M629 712 L 629 312" stroke="#58D3A6"/>
  </g>
  <rect x="705" y="640" width="58" height="108" rx="14" fill="#F4F7FB"/>
</svg>
